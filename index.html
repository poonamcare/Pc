<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#4B1A86">
<title>Poonam Care</title>
<link rel="icon" href="logo.webp">
<style>
:root{--bg:#F5EFFB;--card:#fff;--ink:#25103F;--muted:#6F6288;--p1:#7A2BD1;--p2:#4B1A86;--p3:#2E0F55;--pink:#FF2E88;--gold:#E9B949;--red:#E3122F;--red2:#9E0A20;--green:#0F9D58;--line:#E6DCF3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 500px at 50% -120px,#E4D2FA 0,var(--bg) 60%) fixed;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans Devanagari',Roboto,sans-serif;font-size:16px;line-height:1.45;min-height:100vh;overflow-x:hidden}
img{max-width:100%}
h1{font-size:24px;margin:.4em 0 .2em}h2{font-size:18px;margin:0 0 10px}h3{margin:0 0 4px}
.muted{color:var(--muted)}.s{font-size:13px}.center{text-align:center}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 150px}
.wrap.center{padding-top:48px}
.logo-sm{width:96px;height:96px;object-fit:contain;border-radius:20px}
.logo-lg{width:200px;height:200px;object-fit:contain;border-radius:28px;box-shadow:0 14px 40px rgba(75,26,134,.25)}
.foot{margin-top:26px;color:var(--muted);font-size:12px;text-align:center}
/* header + 3D hero */
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 12px}
.top .tl{width:64px;height:64px;border-radius:16px;background:#fff;box-shadow:0 4px 0 #D8C6EE,0 10px 22px rgba(75,26,134,.2);flex:none;object-fit:contain;transform:perspective(500px) rotateY(var(--ry,-8deg)) rotateX(var(--rx,6deg));transition:transform .2s;animation:float 4s ease-in-out infinite}
.top b{display:block;font-size:20px;color:var(--p2);letter-spacing:.2px}.top span{font-size:12px;color:var(--muted)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -4px}}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;background:#EFE6FA;color:var(--p2)}
.pill.on{background:#DDF6E8;color:#0A6B3A}.pill.off{background:#F1ECF6;color:#6F6288}.pill.warn{background:#FFF0CC;color:#7A5300}.pill.bad{background:#FFE0E5;color:#9E0A20}
.pill i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.pill.on i{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.25}}
/* cards */
.card{background:var(--card);border-radius:20px;padding:14px;margin:0 0 14px;box-shadow:0 2px 0 #E8DDF5,0 14px 30px rgba(75,26,134,.10)}
.card.glass{background:linear-gradient(135deg,#fff,#F6EDFF)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{background:linear-gradient(180deg,#fff,#F8F2FE);border:1px solid var(--line);border-radius:16px;padding:10px;transform:perspective(600px) rotateX(2deg);box-shadow:0 5px 0 #E3D6F2,0 10px 16px rgba(75,26,134,.10)}
.person .nm{font-weight:800;color:var(--p2);margin-bottom:8px;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .nm em{font-style:normal;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--pink));color:#fff;display:inline-grid;place-items:center;font-size:13px;flex:none}
.person .row{display:flex;gap:6px}
.nocopy,.nocopy *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.help{display:flex;flex-wrap:wrap;gap:8px}
/* 3D buttons */
button{font:inherit;cursor:pointer}
.b3{border:0;color:#fff;font-weight:800;border-radius:14px;padding:12px 14px;background:linear-gradient(180deg,var(--p1),var(--p2));box-shadow:0 5px 0 var(--p3),0 10px 18px rgba(75,26,134,.35);transform:translateY(0);transition:transform .07s,box-shadow .07s;min-height:44px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.b3:active{transform:translateY(4px);box-shadow:0 1px 0 var(--p3),0 3px 6px rgba(75,26,134,.35)}
.b3.sm{padding:8px 10px;font-size:14px;min-height:38px;flex:1;border-radius:12px;box-shadow:0 4px 0 var(--p3),0 8px 12px rgba(75,26,134,.25)}
.b3.green{background:linear-gradient(180deg,#19B96B,#0B7F46);box-shadow:0 5px 0 #075A31,0 10px 18px rgba(11,127,70,.35)}
.b3.pink{background:linear-gradient(180deg,#FF5BA6,#D81B72);box-shadow:0 5px 0 #96114F,0 10px 18px rgba(216,27,114,.35)}
.b3.red{background:linear-gradient(180deg,#FF4560,var(--red));box-shadow:0 5px 0 var(--red2),0 10px 18px rgba(227,18,47,.4)}
.b3.gold{background:linear-gradient(180deg,#F6CF6B,#C9962B);color:#3b2a00;box-shadow:0 5px 0 #8E6A12,0 10px 18px rgba(201,150,43,.35)}
.b3.light{background:#fff;color:var(--p2);box-shadow:0 4px 0 #D8C6EE,0 8px 14px rgba(75,26,134,.12)}
.b3.big{width:100%;font-size:19px;padding:16px;border-radius:18px}
.b3[disabled]{opacity:.5;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-weight:700;color:var(--p2);min-width:62px;text-align:center}
.chip small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.chip.sel{border-color:var(--p1);background:#F0E4FF;box-shadow:0 3px 0 #CDB3EE}
.chip span{font-size:24px;display:block;line-height:1.1}
/* RED ALERT bar */
.sos{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(245,239,251,0),var(--bg) 40%)}
.sos .in{max-width:520px;margin:0 auto}
.hold{position:relative;width:100%;border:0;border-radius:20px;padding:0;color:#fff;overflow:hidden;background:linear-gradient(180deg,#FF4560,var(--red) 55%,#B30D25);box-shadow:0 7px 0 var(--red2),0 16px 28px rgba(227,18,47,.5);touch-action:none;-webkit-user-select:none;user-select:none;transition:transform .08s,box-shadow .08s}
.hold.down{transform:translateY(5px);box-shadow:0 2px 0 var(--red2),0 6px 12px rgba(227,18,47,.5)}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35)}
.hold .t{position:relative;display:block;padding:15px 10px;font-weight:900;font-size:20px;letter-spacing:.5px}
.hold .t small{display:block;font-size:12px;font-weight:700;opacity:.9;letter-spacing:0}
/* alert screen */
.alertbox{position:fixed;inset:0;z-index:60;overflow:auto;background:linear-gradient(180deg,#B30D25,#6E0615);color:#fff;padding:18px 14px 30px;animation:flash 1s infinite}
@keyframes flash{50%{background:linear-gradient(180deg,#E3122F,#8B0A1E)}}
.alertbox .in{max-width:520px;margin:0 auto}
.alertbox h1{font-size:30px;text-align:center;margin:6px 0}
.alertbox .box{background:rgba(255,255,255,.14);border-radius:16px;padding:12px;margin:12px 0}
.alertbox .person{background:#fff;color:var(--ink);transform:none}
.alertbox .st{font-size:14px}.alertbox .st div{margin:3px 0}
.ok{color:#9CFFC8}.no{color:#FFD0D6}
/* modal + PIN */
.modal{position:fixed;inset:0;z-index:80;background:rgba(37,16,63,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pin{text-align:center}.dots{display:flex;gap:14px;justify-content:center;margin:12px 0 4px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--p1);display:block}.dots i.on{background:var(--p1)}
.err{color:var(--red);min-height:22px;margin:4px 0;font-weight:700;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{border:0;border-radius:16px;background:#F3EAFC;color:var(--p2);font-size:24px;font-weight:800;padding:14px 0;box-shadow:0 3px 0 #D8C6EE;transition:transform .05s}
.pad button:active{transform:translateY(3px);box-shadow:none}.pad .ghost{background:transparent;box-shadow:none;font-size:15px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:#25103F;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90%;text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
ul.cons{padding-left:20px;margin:10px 0}ul.cons li{margin:6px 0}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-weight:600}label.chk input{width:22px;height:22px;flex:none;margin-top:2px}
/* parent view: 3D map */
.map{position:relative;height:340px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#cfd9e6,#e9eef5);perspective:850px;box-shadow:0 2px 0 #E8DDF5,0 14px 30px rgba(75,26,134,.18);margin-bottom:12px}
.plane{position:absolute;left:50%;top:50%;width:1280px;height:1280px;margin:-640px 0 0 -640px;transform-style:preserve-3d;transform:rotateX(var(--tilt,50deg));transform-origin:50% 56%;transition:transform .5s}
.plane img{position:absolute;width:256px;height:256px;image-rendering:auto}
.plane svg{position:absolute;left:0;top:0;width:1280px;height:1280px;overflow:visible}
.me{position:absolute;left:640px;top:640px;transform-style:preserve-3d}
.me .ring{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:rgba(255,46,136,.28);border:2px solid var(--pink);animation:pulse 1.8s infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.7);opacity:0}}
.me .pinx{position:absolute;left:0;top:0;transform-origin:50% 100%;transform:translate(-50%,-100%) rotateX(calc(var(--tilt,50deg) * -1));font-size:34px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35));white-space:nowrap}
.me .pinx b{display:block;font-size:11px;background:#fff;color:var(--p2);border-radius:8px;padding:1px 7px;margin-top:-4px;text-align:center}
.mapbtn{position:absolute;right:8px;z-index:3;width:42px;height:42px;border:0;border-radius:12px;background:#fff;color:var(--p2);font-weight:900;font-size:20px;box-shadow:0 3px 0 #D8C6EE,0 6px 12px rgba(0,0,0,.2)}
.attr{position:absolute;left:6px;bottom:4px;font-size:10px;background:rgba(255,255,255,.8);padding:1px 5px;border-radius:6px;z-index:3}
.nomap{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px;z-index:2}
.tl{list-style:none;padding:0;margin:0}.tl li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.tl li:last-child{border:0}
.tl .ic{width:34px;height:34px;border-radius:50%;background:#F0E4FF;display:grid;place-items:center;flex:none}
.tl .tm{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
/* admin */
.wrap.adm{max-width:980px}
.adm input,.adm select,.adm textarea{width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.adm textarea{min-height:110px}.adm label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px;color:var(--p2)}
.cr{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;padding:8px;border:1px dashed var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted)}.tw{overflow-x:auto}
.qrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.qrs canvas{width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
.banner{background:#FFF0CC;color:#6a4700;border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.warnbox{background:#FFE9EC;color:#8A0A1D;border-radius:14px;padding:10px 12px;font-size:14px;margin:10px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.alertbox .grid2.nocopy{grid-template-columns:1fr}
.person .row{flex-wrap:wrap}
.alertbox .person .row .b3.sm{min-width:84px}

</style>

defs['QR8bitByte']=function(module,exports,require){
var QRMode = require('./QRMode');

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

module.exports = QR8bitByte;

};
defs['QRBitBuffer']=function(module,exports,require){
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

};

defs['QRMath']=function(module,exports,require){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];

	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

defs['QRPolynomial']=function(module,exports,require){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

};

	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

};

<script>
'use strict';
/* Poonam Care - shared code (database, PIN pad, siren, location, email, helpers) */

PC.host = (PC.qs.get('d') || '').replace(/^https?:\/\//, '').replace(/[\/\s]+$/, '');
if (PC.host && !PC.hostOk(PC.host)) PC.host = '__bad__';

PC.arr = x => (Array.isArray(x) ? x.filter(v => v != null) : x && typeof x === 'object' ? Object.values(x) : []);
PC.rand = (n) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => (b % 36).toString(36)).join(''); };
PC.sha256 = async s => { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, '0')).join(''); };
PC.hashPin = (salt, pin) => PC.sha256(salt + ':' + pin);
PC.digits = s => String(s || '').replace(/\D/g, '');
PC.normPhone = s => { let d = PC.digits(s); if (d.length === 10) d = PC.country + d; else if (d.length === 11 && d[0] === '0') d = PC.country + d.slice(1); return d; };
PC.mapLink = (lat, lng) => 'https://www.google.com/maps?q=' + lat + ',' + lng;
PC.timeStr = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
PC.dist = (a, b) => { const R = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };

/* ---------- database: Firebase REST, or a local test database when no host is given ---------- */
PC.db = (function () {
  const KEY = 'pc_demo_db';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
  const save = o => localStorage.setItem(KEY, JSON.stringify(o));
  const parts = p => p.split('/').filter(Boolean);
  function dget(path) { let c = load(); for (const k of parts(path)) { if (c == null || typeof c !== 'object' || !(k in c)) return null; c = c[k]; } return c === undefined ? null : c; }
  function dput(path, val) {
    const o = load(), ks = parts(path); let c = o;
    for (let i = 0; i < ks.length - 1; i++) { if (c[ks[i]] == null || typeof c[ks[i]] !== 'object') c[ks[i]] = {}; c = c[ks[i]]; }
    if (val === null) delete c[ks[ks.length - 1]]; else c[ks[ks.length - 1]] = val;
    save(o);
  }
  function last(obj, n) { if (!obj || typeof obj !== 'object') return obj; const ks = Object.keys(obj).sort().slice(-n), r = {}; ks.forEach(k => r[k] = obj[k]); return r; }
  async function call(method, path, body, query) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 9000);
    try {
      const init = { method, signal: ctl.signal };
      if (body !== undefined) { init.body = JSON.stringify(body); if (init.body.length < 60000) init.keepalive = true; }
      const r = await fetch('https://' + PC.host + '/' + path + '.json' + (query || ''), init);
      if (!r.ok) throw new Error('Database error ' + r.status);
      return await r.json();
    } finally { clearTimeout(to); }
  }
  const newKey = () => '-' + Date.now().toString(36).padStart(9, '0') + PC.rand(5);
  return {
    async get(path, lastN) {
      if (PC.demo) { const v = dget(path); return lastN ? last(v, lastN) : v; }
      return call('GET', path, undefined, lastN ? '?orderBy=%22%24key%22&limitToLast=' + lastN : '');
    },
    async put(path, val) { if (PC.demo) { dput(path, val); return val; } return call('PUT', path, val); },
    async patch(path, obj) { if (PC.demo) { Object.keys(obj).forEach(k => dput(path + '/' + k, obj[k])); return obj; } return call('PATCH', path, obj); },
    async post(path, val) { if (PC.demo) { const k = newKey(); dput(path + '/' + k, val); return { name: k }; } return call('POST', path, val); },
    async del(path) { if (PC.demo) { dput(path, null); return null; } return call('DELETE', path); }
  };
})();

/* PIN pad. onSubmit(pin) -> true (accepted) | string (error text). Resolves true, or null if cancelled. */
PC.pinPad = function (o) {
  return new Promise(resolve => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="sheet pin"><h3>${esc(o.title)}</h3><p class="muted s">${esc(o.sub || '')}</p>
      <div class="dots"><i></i><i></i><i></i><i></i></div><p class="err" aria-live="polite"></p>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('')}
      <button type="button" class="ghost" data-k="x">${esc(o.cancelText || 'Cancel')}</button><button type="button" data-k="0">0</button><button type="button" class="ghost" data-k="b">&#9003;</button></div></div>`;
    document.body.appendChild(m);
    let pin = '', busy = false;
    const dots = m.querySelectorAll('.dots i'), err = m.querySelector('.err');
    const paint = () => dots.forEach((d, i) => d.className = i < pin.length ? 'on' : '');
    const close = v => { document.removeEventListener('keydown', key); m.remove(); resolve(v); };
    async function press(k) {
      if (busy) return;
      if (k === 'x') return close(null);
      if (k === 'b') { pin = pin.slice(0, -1); err.textContent = ''; return paint(); }
      if (pin.length >= 4) return;
      pin += k; paint();
      if (pin.length === 4) {
        busy = true; let r;
        try { r = await o.onSubmit(pin); } catch (e) { r = String(e.message || e); }
        busy = false;
        if (r === true) return close(true);
        err.textContent = r || 'Wrong PIN'; pin = ''; paint(); m.firstChild.classList.add('shake'); setTimeout(() => m.firstChild.classList.remove('shake'), 400);
      }
    }
    const key = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('b'); else if (e.key === 'Escape') press('x'); };
    document.addEventListener('keydown', key);
    m.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) press(b.dataset.k); });
  });
};
/* Checks a PIN with a short lock after repeated mistakes (kept in this browser only) */
PC.pinCheck = async function (rec, which, pin) {
  const lk = JSON.parse(sessionStorage.getItem('pc_lock') || '{"n":0,"u":0}');
  if (Date.now() < lk.u) return 'Too many tries. Wait ' + Math.ceil((lk.u - Date.now()) / 1000) + 's';
  const ok = (await PC.hashPin(rec.salt, pin)) === rec[which === 'g' ? 'gh' : 'ph'];
  if (ok) { sessionStorage.setItem('pc_lock', '{"n":0,"u":0}'); return true; }
  lk.n++; if (lk.n >= 5) { lk.u = Date.now() + 30000; lk.n = 0; }
  sessionStorage.setItem('pc_lock', JSON.stringify(lk)); return 'Wrong PIN';
};

    if (loc) {

    const list = events.slice().reverse().slice(0, 14);
    $('#tl').innerHTML = list.length ? list.map(e => { const [ic, t] = txt(e); return `<li><span class="ic">${ic}</span><span>${esc(t)}</span><span class="tm">${PC.timeStr(e.t)}</span></li>`; }).join('') : '<li class="muted">अभी कुछ नहीं।</li>';

    const a = rec.alert, live = a && !a.resolved;
    $('#ban').innerHTML = live ? `<div class="warnbox"><b>रेड अलर्ट चालू है!</b> ${PC.timeStr(a.t)} बजे। <button class="b3 sm" id="showa" style="margin-top:8px">अलर्ट खोलें</button></div>` : (a && a.resolved ? `<div class="banner">पिछला अलर्ट बंद हुआ: सुरक्षित बताया गया।</div>` : '');

        b.disabled = true; try { await PC.db.patch('g/' + r.gid, { active: !r.active }); r.active = !r.active; saveReg(); PC.toast('No. ' + r.n + ' ' + r.name + ': service ' + (r.active ? 'ON' : 'OFF')); } catch (er) { PC.toast('Could not change (no internet?)'); } drawTable();
      } else if (b.dataset.a === 'qr') {
        const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="sheet"><h3>' + esc(r.name) + ' &middot; No. ' + r.n + '</h3><p class="muted s">Person PIN: <b>' + esc(r.pin) + '</b> &middot; Family PIN: <b>' + esc(r.ppin) + '</b></p><div id="mq"></div><button class="b3 light big" style="margin-top:12px" id="mc">Close</button></div>';
        document.body.appendChild(m); cardsFor(r, $('#mq', m)); $('#mc', m).onclick = () => m.remove();
      } else if (b.dataset.a === 'del') {
        if (!confirm('Delete ' + r.name + '? Their QR codes will stop working.')) return;
        try { await PC.db.del('g/' + r.gid); await PC.db.del('t/' + r.gid); } catch (er) { return PC.toast('Could not delete (no internet?)'); }
        reg = reg.filter(x => x.gid !== r.gid); saveReg(); drawTable();
      }
    };
  }
  function dl(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }

  async function create() {
    const name = $('#nm').value.trim(), gp = $('#gp').value.trim(), pp = $('#pp').value.trim(), contacts = readRows();
    if (!name) return PC.toast('Enter the name');
    if (!/^\d{4}$/.test(gp) || !/^\d{4}$/.test(pp)) return PC.toast('Both PINs must be 4 digits');
    if (!contacts.length) return PC.toast('Add at least one contact with a phone number');
    const emails = [...new Set($('#em').value.split(/[\s,;]+/).map(s => s.trim().toLowerCase()).filter(s => /^\S+@\S+\.\S+$/.test(s)))];
    const n = reg.reduce((m, r) => Math.max(m, r.n), 0) + 1, gid = PC.rand(16), salt = PC.rand(12);
    const rec = { v: 1, n, name, phone: PC.digits($('#ph').value).slice(-10), contacts, emails, active: true, salt, gh: await PC.hashPin(salt, gp), ph: await PC.hashPin(salt, pp), created: Date.now(), base: base(), marksMail: $('#mm').checked };
    if (cfg.s && cfg.t && cfg.k) rec.mail = { s: cfg.s, t: cfg.t, k: cfg.k };
    $('#mk').disabled = true;
    try { await PC.db.put('g/' + gid, rec); } catch (e) { $('#mk').disabled = false; return PC.toast('Could not save: ' + e.message + '. Check Settings.', 4500); }
    $('#mk').disabled = false;
    const r = { gid, n, name, phone: rec.phone, pin: gp, ppin: pp, contacts, emails, created: rec.created, active: true, consent: false };
    reg.push(r); saveReg(); drawTable();
    $('#res').innerHTML = `<div class="card"><h2>Done: ${esc(name)} (No. ${n})</h2><div class="warnbox">Tell them the PINs yourself. Do not write them on the QR card.<br><b>Person PIN: ${esc(gp)} &nbsp; Family PIN: ${esc(pp)}</b></div><div id="rq"></div></div>`;
    cardsFor(r, $('#rq')); $('#res').scrollIntoView({ behavior: 'smooth' });
    $('#nm').value = ''; $('#ph').value = ''; $('#paste').value = ''; $('#gp').value = rpin(); $('#pp').value = rpin();
  }

  function drawTable() {
    $('#cnt').textContent = '(' + reg.length + ')';
    $('#tb').innerHTML = reg.slice().sort((a, b) => b.n - a.n).map(r => `<tr><td>${r.n}</td><td>${esc(r.name)}</td><td>${r.consent ? 'Yes' : '<span class="muted">No</span>'}</td>
      <td><button class="b3 sm ${r.active ? 'green' : 'red'}" data-a="pay" data-g="${r.gid}" style="min-width:128px">${r.active ? 'PAID ✔ ON' : 'NOT PAID ✖ OFF'}</button></td>
      <td><button class="b3 sm light" data-a="qr" data-g="${r.gid}">QR</button></td><td><button class="b3 sm light" data-a="del" data-g="${r.gid}">&#128465;</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">No one added yet.</td></tr>';
  }
  async function refresh() {
    await Promise.all(reg.map(async r => { try { const v = await PC.db.get('g/' + r.gid); if (v) { r.active = v.active !== false; r.consent = !!v.consent; } } catch (e) { } }));
    saveReg(); drawTable();
  }
};

PC.start();
</script>
</body>
</html>
